services:
  - type: cron
    name: dipvtc-database-backup-r2
    runtime: docker
    dockerfilePath: ./backup/Dockerfile
    schedule: "30 21 * * *"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: dipvtc-web
          envVarKey: DATABASE_URL
      - key: MEDIA_S3_ENDPOINT
        fromService:
          type: web
          name: dipvtc-web
          envVarKey: MEDIA_S3_ENDPOINT
      - key: MEDIA_S3_BUCKET
        fromService:
          type: web
          name: dipvtc-web
          envVarKey: MEDIA_S3_BUCKET
      - key: MEDIA_S3_REGION
        fromService:
          type: web
          name: dipvtc-web
          envVarKey: MEDIA_S3_REGION
      - key: MEDIA_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: dipvtc-web
          envVarKey: MEDIA_S3_ACCESS_KEY_ID
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: dipvtc-web
          envVarKey: MEDIA_S3_SECRET_ACCESS_KEY
      - key: EXPECTED_DATABASE_NAME
        value: dipvtc_web
      - key: BACKUP_R2_PREFIX
        value: database-backups
      - key: BACKUP_DAILY_RETENTION_DAYS
        value: "30"

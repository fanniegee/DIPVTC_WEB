<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · DIPVTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#172b49;font:400 15px Montserrat,Arial,sans-serif}.card{width:min(430px,92vw);background:#fff;padding:30px;border-radius:18px;box-shadow:0 18px 60px #102b5918}.brand{font-weight:900;color:#e67e22}.brand span{color:#0a1931}h1{font-size:25px;font-weight:800;margin:8px 0}p{color:#64748b;line-height:1.6}.field{display:block;margin:16px 0 6px;font-size:12px;font-weight:700}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.button{width:100%;margin-top:18px;padding:13px;background:#0a1931;color:#fff;border:0;border-radius:9px;font:700 14px Montserrat,Arial,sans-serif;cursor:pointer}.message{min-height:20px;color:#a12626;font-size:13px;margin-top:12px}a{color:#0a1931}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">DIP<span>VTC</span></div>
    <h1 id="loginTitle">Sign in</h1>
    <p id="loginHint">Use your school account. Passwords are checked on the server and are not saved in this browser.</p>
    <form id="login">
      <label class="field" for="email">EMAIL</label><input id="email" type="email" autocomplete="username" required>
      <label class="field" for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Sign in</button><div class="message" id="message" role="status"></div>
    </form>
    <p><a href="/password-help.html">Forgot your password?</a></p>
    <p><a href="/family-registration.html">New student? Apply and create your student account</a></p><p><a href="/portal-login.html">Parent and Student Portal sign in</a></p>
    <p><a href="/">Return to the school website</a></p>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const requested=params.get("next");
    const next=["/staff.html","/admin.html","/owner.html","/exam-mark-entry/","/parent-portal.html","/student-portal.html"].includes(requested)?requested:"";
    const title=document.getElementById("loginTitle");
    const hint=document.getElementById("loginHint");
    if(next==="/staff.html"){
      title.textContent="Staff sign in";
      hint.textContent="Sign in with your activated staff account to open the shared Staff dashboard.";
    }else if(next==="/exam-mark-entry/"){
      title.textContent="Teacher sign in";
      hint.textContent="Sign in with your activated Teacher account to open Exam Mark-Entry.";
    }else if(next==="/admin.html"){
      title.textContent="Admin / Owner sign in";
      hint.textContent="Sign in with your Admin or Owner account. Admins open the Admin panel; Owners open the Owner panel.";
    }else if(next==="/owner.html"){
      title.textContent="Owner sign in";
      hint.textContent="Use the school Owner account to open the Owner panel.";
    }else if(next==="/parent-portal.html"){
      title.textContent="Parent Portal sign in"; hint.textContent="View learning updates and records for learners linked to your parent account.";
    }else if(next==="/student-portal.html"){
      title.textContent="Student Portal sign in"; hint.textContent="Open your personal learning dashboard using the account issued by Admissions.";
    }
    document.getElementById("login").addEventListener("submit",async event=>{
      event.preventDefault();
      const message=document.getElementById("message");
      message.textContent="Signing in…";
      try{
        const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value,portal:next})});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||"Sign in failed.");
        const role=data.user.role;
        let destination;
        if(next==="/exam-mark-entry/"){
          if(role!=="teacher")throw new Error("Exam Mark-Entry is available to Teacher accounts.");
          destination="/exam-mark-entry/";
        }else if(next==="/staff.html"){
          if(!["principal","teacher","admissions","finance","content","front_desk","staff"].includes(role))throw new Error("This is the Staff Login. Use Admin / Owner Login for management accounts.");
          destination="/staff.html";
        }else if(next==="/admin.html"){
          if(role==="owner")destination="/owner.html";
          else if(role==="admin")destination="/admin.html";
          else throw new Error("Staff accounts must use Staff Login.");
        }else if(next==="/owner.html"){
          if(role!=="owner")throw new Error("This account cannot open the Owner panel.");
          destination="/owner.html";
        }else if(next==="/parent-portal.html"||next==="/student-portal.html"){
          if(role!==(next==="/parent-portal.html"?"parent":"student"))throw new Error("This account cannot open that portal. Choose the correct portal sign-in.");
          destination=next;
        }else{
          destination=role==="owner"?"/owner.html":role==="admin"?"/admin.html":"/staff.html";
        }
        location.href=destination;
      }catch(error){message.textContent=error.message;}
    });
  </script>
</body>
</html>

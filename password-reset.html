<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a New Password · DIPVTC</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f7;color:#172b49;font:14px Montserrat,Arial,sans-serif;padding:20px}.card{width:min(460px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 18px 60px #102b5918}h1{font-weight:900}label{display:block;font-weight:800;font-size:11px;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cad5e2;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;color:white;background:#0a1931;font:800 13px Montserrat;cursor:pointer}#msg{min-height:28px;color:#a12626;font-size:12px}</style></head><body><main class="card"><p style="color:#e67e22;font-weight:900">DIPVTC ACCOUNT SUPPORT</p><h1>Choose a new password</h1><p>Use at least 10 characters. The one-time link expires after one hour.</p><form id="form"><label for="password">NEW PASSWORD</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">CONFIRM PASSWORD</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button class="btn">Save new password</button></form><p id="msg"></p><a href="/login.html">Back to sign in</a></main><script>const token=new URLSearchParams(location.search).get('token')||'',formEl=document.getElementById('form'),passwordEl=document.getElementById('password'),confirmEl=document.getElementById('confirm'),msgEl=document.getElementById('msg');formEl.addEventListener('submit',async e=>{e.preventDefault();if(passwordEl.value!==confirmEl.value){msgEl.textContent='Passwords do not match.';return}msgEl.textContent='Saving…';try{const r=await fetch('/api/auth/password-reset/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:passwordEl.value})}),d=await r.json();if(!r.ok)throw Error(d.error);msgEl.style.color='#16804a';msgEl.textContent='Password updated. Sign in with your new password.';formEl.hidden=true}catch(e){msgEl.textContent=e.message}})</script></body></html>

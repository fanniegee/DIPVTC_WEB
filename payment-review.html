<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment approvals · DIPVTC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#0a1931;--peach:#e67e22;--ink:#172b49;--muted:#64748b;--line:#e1e8f1;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Montserrat,Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:20px;margin:0}.top p{margin:5px 0 0;color:#d9e3f0;font-size:11px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 12px;border-radius:8px;font-size:10px;font-weight:800}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px}.head h2{margin:0;font-size:22px}.head p{margin:5px 0;color:var(--muted);font-size:11px;line-height:1.6}.refresh{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font:700 10px Montserrat;cursor:pointer}.notice{font-size:11px;color:var(--muted);margin:14px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:16px;box-shadow:0 3px 12px #17345708}.card-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.card h3{margin:0;font-size:14px}.meta{margin:5px 0;color:var(--muted);font-size:10px;line-height:1.7}.amount{font-size:19px;font-weight:900;color:var(--navy);white-space:nowrap}.details{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{padding:6px 9px;border-radius:20px;background:#f1f5f9;font-size:9px;font-weight:800}.status{font-size:10px;color:#52647e;min-height:16px;margin-top:8px}.actions{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:8px;align-items:center}.actions input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font:500 11px Montserrat}.actions button{border:0;border-radius:8px;padding:10px 13px;color:white;background:var(--navy);font:800 10px Montserrat;cursor:pointer}.actions button.reject{background:#ff8a65;color:#451a03}.actions button:disabled{opacity:.5}.empty{background:#fff;padding:26px;border:1px dashed #cbd5e1;border-radius:10px;color:var(--muted);font-size:12px}.error{color:#b42318}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.head{align-items:flex-start;flex-direction:column}.card-top{flex-direction:column}.actions{grid-template-columns:1fr 1fr}.actions input{grid-column:1/-1}}</style></head><body><header class="top"><div><h1>DIPVTC · Payment approvals</h1><p id="signedIn">Owner, Main Admin and Finance Office</p></div><a href="/admin.html">Back to dashboard</a></header><main class="wrap"><div class="head"><div><h2>Pending learner payments</h2><p>Check each amount against the office receipt, then approve or reject it. Only approved amounts count toward portal access.</p></div><button class="refresh" id="refresh">Refresh list</button></div><p class="notice" id="notice" role="status">Loading payment submissions…</p><div id="list"></div></main><script>
const list=document.getElementById('list'),notice=document.getElementById('notice');const safeDate=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString()};function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}async function load(){notice.textContent='Loading payment submissions…';notice.className='notice';try{const r=await fetch('/api/admin/learner-payments',{credentials:'same-origin',cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not load submissions.');list.replaceChildren();const items=data.submissions||[];notice.textContent=items.length+' payment submission'+(items.length===1?'':'s')+' awaiting review.';if(!items.length){list.append(node('div','empty','There are no pending learner payments.'));return}for(const payment of items){const card=node('article','card'),top=node('div','card-top'),heading=node('div');heading.append(node('h3','',payment.full_name+' · '+payment.student_number));heading.append(node('p','meta',(payment.class_name||'Class not assigned')+' · '+(payment.level||'Level not set')+' · Parent: '+(payment.parent_name||payment.parent_email||'Unknown')));top.append(heading,node('div','amount','R'+Number(payment.amount).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})));card.append(top);const details=node('div','details');details.append(node('span','pill',payment.payment_kind==='onboarding'?'Initial registration':'Monthly payment'));details.append(node('span','pill','Period: '+payment.period_key));if(payment.payment_method)details.append(node('span','pill','Method: '+payment.payment_method));if(payment.payment_reference)details.append(node('span','pill','Reference: '+payment.payment_reference));details.append(node('span','pill','Submitted: '+safeDate(payment.created_at)));card.append(details);const controls=node('div','actions'),note=node('input');note.type='text';note.maxLength=1000;note.placeholder='Office note (optional)';const approve=node('button','','Approve payment'),reject=node('button','reject','Reject');approve.type=reject.type='button';const status=node('div','status');controls.append(note,approve,reject);card.append(controls,status);async function review(decision,button){button.disabled=approve.disabled=reject.disabled=true;status.textContent=decision==='approved'?'Approving…':'Rejecting…';try{const response=await fetch('/api/admin/learner-payments/'+encodeURIComponent(payment.id)+'/review',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,note:note.value.trim()})}),result=await response.json();if(!response.ok)throw Error(result.error||'Could not review this payment.');status.textContent=decision==='approved'?'Payment approved. Portal access will update to reflect the approved total.':'Payment rejected.';card.style.opacity='.65';setTimeout(()=>card.remove(),900);notice.textContent='Payment review saved.'}catch(error){status.textContent=error.message;approve.disabled=reject.disabled=false}}approve.addEventListener('click',()=>review('approved',approve));reject.addEventListener('click',()=>review('rejected',reject));list.append(card)}}catch(error){list.replaceChildren();notice.textContent=error.message;notice.className='notice error'}}document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signed School Rules Archive · DIPVTC</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0a1931;--peach:#e67e22;--ink:#172b49;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:14px Montserrat,Arial,sans-serif}.top{background:linear-gradient(120deg,#0a1931,#213c60);color:#fff;padding:22px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.top h1{font-size:24px;margin:6px 0;font-weight:900}.top p{margin:0;color:#d7e2f1;font-size:12px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:10px 14px;font:800 11px Montserrat,Arial,sans-serif;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.peach{background:var(--peach)}.btn.light{background:#eef2f7;color:var(--ink)}main{max-width:1100px;margin:22px auto;padding:0 16px}.bar,.record{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar input{flex:1;min-width:220px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;font:500 13px Montserrat,Arial,sans-serif}.record{border-left:4px solid var(--peach)}.record h2{font-size:15px;margin:0 0 5px}.meta{font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:10px}.record-actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;color:var(--muted);padding:8px}.signer{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.signer img{max-width:250px;width:100%;height:90px;object-fit:contain;object-position:left center;background:#fff;border:1px solid var(--line);border-radius:7px}.hidden{display:none!important}
  </style>
</head>
<body>
  <header class="top"><div><strong style="color:#ffd0ad">ADMISSIONS WORKSPACE</strong><h1>Signed School Rules Archive</h1><p>Search, print or save the permanently filed rules agreement for any online registration.</p></div><div class="actions"><a class="btn light" href="/registration-requests.html">Student Applications</a><a class="btn" href="/registrations.html">Learner Records</a></div></header>
  <main><section class="bar"><input id="search" type="search" placeholder="Search learner, student number, email or signer"><span id="count" class="meta"></span></section><div id="list" class="status" role="status" aria-live="polite">Loading signed forms…</div></main>
  <script>
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let records=[];
    async function load(){const list=document.getElementById('list');try{const response=await fetch('/api/admissions/family-rules',{credentials:'same-origin',cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Signed rules records could not be loaded.');records=data.records||[];draw()}catch(error){list.textContent=error.message}}
    function printRecord(record){const popup=window.open('','_blank','width=900,height=800');if(!popup){alert('Allow pop-ups for this school website to print the signed form.');return}const signature=/^data:image\/png;base64,[A-Za-z0-9+/]+={0,2}$/.test(record.family_rules_signature||'')?'<img class="signature" alt="Signer signature" src="'+esc(record.family_rules_signature)+'">':'<p class="missing">No digital signature image was saved for this older registration.</p>';const snapshot=record.family_rules_snapshot?esc(record.family_rules_snapshot):'The exact School Rules text was not snapshotted when this older application was submitted. The signer and signature record remain archived.';popup.document.open();popup.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Signed School Rules · '+esc(record.student_name)+'</title><style>@page{size:A4;margin:18mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172b49;font-size:12px;line-height:1.55;margin:0}.head{border-top:8px solid #0a1931;border-bottom:3px solid #e67e22;padding:14px 0;text-align:center}.head h1{font-size:20px;margin:3px}.head p{margin:3px;color:#52647e}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;padding:13px 0;border-bottom:1px solid #cbd5e1}.rules{white-space:pre-wrap;font:12px/1.55 Arial,sans-serif;margin:14px 0}.sign{border-top:1px solid #cbd5e1;padding-top:12px;margin-top:15px;display:flex;align-items:flex-end;justify-content:space-between;gap:15px}.signature{height:80px;max-width:270px;object-fit:contain;object-position:left bottom}.missing{font-style:italic;color:#64748b}.foot{margin-top:18px;padding-top:8px;border-top:2px solid #0a1931;color:#52647e;font-size:10px}.print{position:fixed;top:12px;right:12px;background:#e67e22;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}@media print{.print{display:none}}</style></head><body><button class="print" onclick="window.print()">Print / Save as PDF</button><header class="head"><h1>DOUBLE IMPACT PRIVATE COLLEGE</h1><p>School Rules &amp; Family Agreement</p><p>Signed registration record</p></header><section class="details"><div><b>Learner:</b> '+esc(record.student_name)+'</div><div><b>Student number:</b> '+esc(record.student_number||'Pending')+'</div><div><b>School:</b> '+esc(record.school_name||record.school_code)+'</div><div><b>Intended class / course:</b> '+esc(record.intended_class)+'</div><div><b>Application status:</b> '+esc(record.status)+'</div><div><b>Submitted:</b> '+esc(record.submitted_at?new Date(record.submitted_at).toLocaleString():'Not recorded')+'</div><div><b>Signed by:</b> '+esc(record.family_rules_signer_name||'Not recorded')+'</div><div><b>Signer role:</b> '+esc(record.family_rules_signer_role==='adult_student'?'Adult learner':'Parent / guardian')+'</div><div><b>ID / passport:</b> '+esc(record.family_rules_signer_id||'Not provided')+'</div><div><b>Signed at:</b> '+esc(record.family_rules_signed_at?new Date(record.family_rules_signed_at).toLocaleString():'Not recorded')+'</div><div><b>Rules version:</b> '+esc(record.family_rules_version||'Legacy record')+'</div></section><pre class="rules">'+snapshot+'</pre><section class="sign"><div><b>Signature</b><br>'+signature+'</div><div><b>Signer:</b> '+esc(record.family_rules_signer_name||'')+'<br><b>Date:</b> '+esc(record.family_rules_signed_at?new Date(record.family_rules_signed_at).toLocaleDateString():'Not recorded')+'</div></section><footer class="foot">This archived agreement is associated with the learner registration shown above. The recorded signing time is generated by the school server when the application is submitted.</footer></body></html>');popup.document.close()}
    function draw(){const query=document.getElementById('search').value.trim().toLowerCase(),list=document.getElementById('list'),filtered=records.filter(record=>[record.student_name,record.student_number,record.student_email,record.guardian_name,record.family_rules_signer_name,record.school_name,record.intended_class].join(' ').toLowerCase().includes(query));document.getElementById('count').textContent=filtered.length+' of '+records.length+' records';list.replaceChildren();if(!filtered.length){list.textContent=records.length?'No signed forms match that search.':'No registration forms have been filed yet.';return}filtered.forEach(record=>{const card=document.createElement('article');card.className='record';const title=document.createElement('h2');title.textContent=(record.student_name||'Learner')+' · '+(record.school_name||record.school_code||'School not recorded');const meta=document.createElement('div');meta.className='meta';meta.textContent=[record.student_number||'No student number',record.intended_class||'Class not recorded',record.status||'Status unavailable',record.family_rules_signer_name||'Signer not recorded',record.family_rules_signed_at?new Date(record.family_rules_signed_at).toLocaleString():'No signing date'].join(' · ');const actions=document.createElement('div');actions.className='record-actions';const print=document.createElement('button');print.className='btn peach';print.textContent='Open printable form';print.onclick=()=>printRecord(record);actions.append(print);if(!record.family_rules_snapshot){const warning=document.createElement('span');warning.className='meta';warning.textContent='Older form: the exact rule text was not stored at submission.';actions.append(warning)}card.append(title,meta,actions);list.append(card)})}
    document.getElementById('search').addEventListener('input',draw);load();
  </script>
</body>
</html>

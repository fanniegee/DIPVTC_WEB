<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate staff account · DIPVTC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#172b49;font:400 14px Montserrat,Arial,sans-serif}.card{width:min(470px,92vw);background:#fff;padding:28px;border-radius:16px;box-shadow:0 18px 60px #102b5918}.brand{font-weight:900;color:#e67e22}.brand span{color:#0a1931}h1{font-size:24px;font-weight:800;margin:10px 0}p{color:#64748b;line-height:1.6}.field{display:block;margin:15px 0 6px;font-size:12px;font-weight:700}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.button{width:100%;margin-top:18px;padding:13px;background:#0a1931;color:white;border:0;border-radius:9px;font:700 14px Montserrat,Arial,sans-serif;cursor:pointer}.message{min-height:20px;color:#a12626;font-size:13px;margin-top:12px}</style></head>
<body><main class="card"><div class="brand">DIP<span>VTC</span></div><h1>Activate your staff account</h1><p id="inviteDetails">Checking the invitation…</p><form id="activation" hidden><label class="field" for="password">CREATE PASSWORD</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label class="field" for="confirm">CONFIRM PASSWORD</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button class="button" type="submit">Activate and open Staff Dashboard</button><div class="message" id="message" role="status"></div></form></main>
<script>
const token=new URLSearchParams(location.search).get("token")||"";const details=document.getElementById("inviteDetails");const form=document.getElementById("activation");const message=document.getElementById("message");
async function checkInvite(){if(!token){details.textContent="This invitation link is missing its secure token.";return;}try{const response=await fetch(`/api/team/invite-status?token=${encodeURIComponent(token)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||"This invitation is invalid or expired.");details.textContent=`Invitation for ${data.name} (${data.email}) · ${data.roleTitle} · ${data.section}`;form.hidden=false;}catch(error){details.textContent=error.message;}}
form.addEventListener("submit",async event=>{event.preventDefault();const password=document.getElementById("password").value;const confirm=document.getElementById("confirm").value;if(password.length<10){message.textContent="Use at least 10 characters.";return;}if(password!==confirm){message.textContent="The passwords do not match.";return;}message.textContent="Activating…";try{const response=await fetch("/api/team/activate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not activate account.");location.href="/staff.html";}catch(error){message.textContent=error.message;}});
checkInvite();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Site Content - DIPVTC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--navy:#0a1931;--orange:#e67e22;--line:#dce5f0;--muted:#718096;--ink:#10213d}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:14px Montserrat,Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px}.top strong{font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions button{border:1px solid #ffffff55;border-radius:8px;background:#fff;color:var(--navy);padding:9px 12px;text-decoration:none;font:700 11px Montserrat,Arial,sans-serif;cursor:pointer}.actions .out{background:#fff2e5;color:#9a4c0b}.wrap{max-width:1120px;margin:24px auto;padding:0 18px}.intro{margin-bottom:16px}.intro small{color:var(--orange);font-weight:900;letter-spacing:1px;text-transform:uppercase}.intro h1{margin:6px 0;font-size:25px}.intro p{color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #10213d08}.card h2{font-size:15px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}.field{display:grid;gap:5px;margin:7px 0}.field label{font-size:10px;font-weight:800;color:#586b85;text-transform:uppercase;letter-spacing:.4px}.field input,.field textarea{width:100%;border:1px solid #ced8e5;border-radius:8px;padding:10px;background:#fff;color:var(--ink);font:500 12px Montserrat,Arial,sans-serif}.field textarea{min-height:90px;resize:vertical}.save{border:0;border-radius:8px;background:var(--orange);color:#fff;padding:12px 18px;font:800 12px Montserrat,Arial,sans-serif;cursor:pointer}.save:disabled{opacity:.55;cursor:wait}.status{display:inline-block;margin-left:12px;color:#246b45;font-size:12px}.hint{font-size:11px;color:var(--muted);line-height:1.6}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.intro h1{font-size:21px}}
</style></head><body>
<header class="top"><strong>DIPVTC · All Site Content</strong><div class="actions"><a id="backLink" href="/staff.html">Back to dashboard</a><button class="out" id="signOut">Sign out</button></div></header><main class="wrap"><div class="intro"><small>Website configuration</small><h1>All Site Content</h1><p>Updates here use the same saved fields as the Owner dashboard and appear on the matching public pages.</p></div><div id="contentGroups"></div><section class="card"><button class="save" id="saveAllContent" type="button">Save All Site Content</button><span id="saveStatus" class="status" role="status"></span></section></main>
<script>
const groups=[
["Homepage and school information",[
["Hero title","dipvtc_site_hero"],["Hero subtitle","dipvtc_site_herosub"],["School motto","dipvtc_site_motto"],["Admission badge","dipvtc_admission_text"],["Welcome title","dipvtc_welcome_title"],["Welcome text","dipvtc_welcome_text","long"],["Programs title","dipvtc_programs_title"],["About title","dipvtc_site_aboutTitle"],["About text","dipvtc_site_about","long"],["Courses title","dipvtc_site_coursesTitle"],["Admission section title","dipvtc_admission_sec_title"],["Admission section text","dipvtc_admission_sec_text","long"],["News title","dipvtc_news_title"],["News subtitle","dipvtc_news_text","long"]]],
["Contact details",[["Contact email","dipvtc_site_email"],["Phone numbers","dipvtc_site_phones"],["Address","dipvtc_site_address"],["Footer text","dipvtc_site_footer"]]],
["Branding and link previews",[["Share preview image URL","dipvtc_site_share_image"],["Browser icon (favicon) URL","dipvtc_site_favicon_url"]]],
["School social platforms",[["Facebook Page","dipvtc_site_facebook"],["WhatsApp","dipvtc_site_whatsapp"],["Instagram","dipvtc_site_instagram"],["TikTok","dipvtc_site_tiktok"],["YouTube","dipvtc_site_youtube"],["X (Twitter)","dipvtc_site_x"],["LinkedIn","dipvtc_site_linkedin"],["Telegram","dipvtc_site_telegram"],["Threads","dipvtc_site_threads"],["Pinterest","dipvtc_site_pinterest"]]]
];
const root=document.getElementById("contentGroups"),fields=[];
for(const [title,items] of groups){const card=document.createElement("section");card.className="card";const heading=document.createElement("h2");heading.textContent=title;card.append(heading);const grid=document.createElement("div");grid.className="grid";for(const [label,key,long] of items){const wrap=document.createElement("div");wrap.className="field";const id="f"+fields.length,l=document.createElement("label");l.htmlFor=id;l.textContent=label;const input=document.createElement(long?"textarea":"input");input.id=id;input.dataset.key=key;if(key==="dipvtc_site_email")input.type="email";if(key==="dipvtc_site_share_image"||key==="dipvtc_site_favicon_url"){input.type="text";input.inputMode="url";input.placeholder="https://... or /assets/images/..."}if(key.startsWith("dipvtc_site_")&&["facebook","whatsapp","instagram","tiktok","youtube","x","linkedin","telegram","threads","pinterest"].some(x=>key.endsWith(x)))input.placeholder="Paste the official public link or contact";wrap.append(l,input);grid.append(wrap);fields.push(input)}card.append(grid);root.append(card)}
const programImageDefaults=[
{name:"Cambridge",image:"/assets/images/cambridge-igcse.png",logo:"/assets/images/cambridge.png",desc:"ECD to A-Levels",link:"cambridge.html",color:"#e67e22"},
{name:"DeityPro FX",image:"/assets/images/fx-technical.png",logo:"/assets/images/deityprofx-main.png",desc:"Forex Trading Institute",link:"deityProFx.html",color:"#27ae60"},
{name:"Practical",image:"/assets/images/computer.png",logo:"/assets/images/practical.png",desc:"Train | Develop | Succeed",link:"practical.html",color:"#059669"},
{name:"South Africa",image:"/assets/images/sasenr.png",logo:"/assets/images/southafrica.png",desc:"ECD to Grade 12 | Matric",link:"southafrica.html",color:"#007a4d"},
{name:"Upgrade",image:"/assets/images/foundation.png",logo:"/assets/images/upgrade.png",desc:"Foundation to Grade 7",link:"upgrade.html",color:"#7c3aed"},
{name:"ZIMSEC",image:"/assets/images/zimsec-primary.png",logo:"/assets/images/zimsec.png",desc:"ECD to HEXCO",link:"zimsec.html",color:"#e67e22"}
];
const programImageCard=document.createElement("section");programImageCard.className="card";programImageCard.innerHTML='<h2>Program card background images</h2><p class="hint">Choose the image shown behind each school card on Programs. The existing school color tint remains layered over the image. Use a project image path such as /assets/images/cambridge-igcse.png or an https image URL.</p><div class="grid" id="programImageFields"></div>';root.append(programImageCard);
const programImageFields=programImageDefaults.map((school,index)=>{const wrap=document.createElement("div");wrap.className="field";const label=document.createElement("label");label.htmlFor="programImage"+index;label.textContent=school.name+" background image";const input=document.createElement("input");input.id="programImage"+index;input.type="text";input.inputMode="url";input.dataset.programSchool=school.name;input.placeholder="/assets/images/... or https://...";wrap.append(label,input);programImageCard.querySelector("#programImageFields").append(wrap);return input});
let savedProgramSchools=programImageDefaults.map(school=>({...school,backgroundImage:school.image}));
function programSchoolKey(value){const name=String(value||"").toLowerCase();return name.includes("cambridge")?"Cambridge":name.includes("deity")?"DeityPro FX":name.includes("practical")?"Practical":name.includes("south africa")?"South Africa":name.includes("upgrade")?"Upgrade":name.includes("zimsec")?"ZIMSEC":""}
function parseProgramSchools(value){try{const parsed=JSON.parse(String(unpack(value)||"null"));return Array.isArray(parsed)&&parsed.length?parsed.map(item=>({...item})):programImageDefaults.map(school=>({...school,backgroundImage:school.image}))}catch{return programImageDefaults.map(school=>({...school,backgroundImage:school.image}))}}
const status=document.getElementById("saveStatus"),saveButton=document.getElementById("saveAllContent");
function unpack(value){if(typeof value!=="string")return value??"";try{const parsed=JSON.parse(value);return typeof parsed==="string"?parsed:value}catch{return value}}
async function loadContent(){status.textContent="Loading saved site content…";try{const response=await fetch("/api/state",{credentials:"same-origin",cache:"no-store"}),data=await response.json();if(!response.ok)throw Error(data.error||"Could not load site content.");for(const field of fields)field.value=String(unpack(data.state?.[field.dataset.key])||"");savedProgramSchools=parseProgramSchools(data.state?.dipvtc_programs_schools);for(const field of programImageFields){const key=field.dataset.programSchool,item=savedProgramSchools.find(school=>programSchoolKey(school.name)===key),fallback=programImageDefaults.find(school=>school.name===key);field.value=String(item?.backgroundImage||fallback?.image||"")}status.textContent="Saved content loaded."}catch(error){status.textContent="Could not load site content: "+error.message}}
async function saveContent(){saveButton.disabled=true;status.textContent="Saving changes…";try{const programs=savedProgramSchools.map(school=>({...school}));for(const field of programImageFields){const key=field.dataset.programSchool;let item=programs.find(school=>programSchoolKey(school.name)===key);if(!item){item={...(programImageDefaults.find(school=>school.name===key)||{} )};programs.push(item)}item.backgroundImage=field.value.trim()}const entries=Object.fromEntries(fields.map(field=>[field.dataset.key,field.value.trim()]));entries.dipvtc_programs_schools=JSON.stringify(programs);const response=await fetch("/api/state/batch",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({entries})}),data=await response.json();if(!response.ok)throw Error(data.error||"The changes could not be saved.");savedProgramSchools=programs;status.textContent="Saved. Owner dashboard, Admin, Content Manager and public program cards now use these values."}catch(error){status.textContent="Save failed: "+error.message}finally{saveButton.disabled=false}}
saveButton.addEventListener("click",saveContent);document.getElementById("signOut").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"}).catch(()=>{});location.assign("/login.html")});const user=window.__DIPVTC_USER__||{},back=document.getElementById("backLink");back.href=user.role==="owner"?"/owner.html":user.role==="admin"?"/admin.html":"/staff.html";loadContent();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Portal · DIPVTC</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f7;color:#172b49;font:14px Montserrat,Arial,sans-serif;padding:20px}.card{width:min(460px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 18px 60px #102b5918}h1{font-weight:900}.muted{color:#64748b;line-height:1.7}.label{display:block;font-weight:800;font-size:11px;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cad5e2;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;color:white;background:#0a1931;font:800 13px Montserrat;cursor:pointer}.msg{min-height:25px;color:#a12626;font-size:12px;line-height:1.6}</style></head><body><main class="card"><p style="color:#e67e22;font-weight:900">DIPVTC FAMILY PORTAL</p><h1>Activate your account</h1><p class="muted" id="info">Checking your secure invitation…</p><form id="form" hidden><section id="rulesAgreement" hidden style="margin:14px 0;padding:14px;border:1px solid #f2b180;border-radius:10px;background:#fff7ef"><strong>School Rules agreement</strong><p class="muted">A parent or guardian must review and sign the current School Rules before activating a manually registered learner account.</p><a href="/family-registration.html?view=rules#rulesStep" target="_blank" rel="noopener">Read the School Rules</a><label class="label" for="rulesSigner">Parent / guardian or adult learner full name</label><input id="rulesSigner" maxlength="180" autocomplete="name"><label style="display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12px;line-height:1.5"><input id="rulesAccepted" type="checkbox" style="width:auto;margin:2px 0 0">I have read and agree to the School Rules for this learner.</label></section><label class="label" for="password">Create password (at least 10 characters)</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label class="label" for="confirm">Confirm password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button class="btn">Activate account</button></form><div class="msg" id="message"></div></main><script>const token=new URLSearchParams(location.search).get('token')||'';let rulesNeeded=false;const info=document.getElementById('info'),formEl=document.getElementById('form'),msg=document.getElementById('message'),passwordEl=document.getElementById('password'),confirmEl=document.getElementById('confirm');fetch('/api/portal/invite-status?token='+encodeURIComponent(token)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);info.textContent=`Invitation for ${d.display_name} (${d.role}). Link expires ${new Date(d.expires_at).toLocaleString()}.`;rulesNeeded=!!d.family_rules_required;document.getElementById('rulesAgreement').hidden=!rulesNeeded;document.getElementById('rulesSigner').required=rulesNeeded;document.getElementById('rulesAccepted').required=rulesNeeded;formEl.hidden=false}).catch(e=>{info.textContent=e.message});formEl.addEventListener('submit',async e=>{e.preventDefault();if(passwordEl.value!==confirmEl.value){msg.textContent='Passwords do not match.';return}msg.textContent='Activating…';try{const r=await fetch('/api/portal/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:passwordEl.value,signerName:document.getElementById('rulesSigner').value.trim(),rulesAccepted:!rulesNeeded||document.getElementById('rulesAccepted').checked})}),d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.redirect}catch(e){msg.textContent=e.message}})</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore DIPVTC study pathways, stages and qualifications.">
<title>Study Pathways | DIPVTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{font-family:'Montserrat',Arial,sans-serif;color:#0a1931;background:#f4f6f9;font-synthesis:none;text-rendering:optimizeLegibility}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f6f9;font-family:'Montserrat',Arial,sans-serif}
.top-nav{min-height:58px;padding:10px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #e5eaf1}.brand{font-size:18px;font-weight:900;color:#0a1931;text-decoration:none;letter-spacing:.02em}.brand span{color:#e67e22}.home-link{padding:9px 16px;border-radius:22px;background:#0a1931;color:#fff;font-size:12px;font-weight:800;text-decoration:none}
.hero{padding:32px 18px 30px;background:linear-gradient(135deg,#0a1931,#183c6b);color:#fff;text-align:center}.hero h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:900}.hero p{margin:9px auto 0;max-width:680px;color:#d6e2f2;font-size:13px;line-height:1.7}
.content{width:min(1160px,100%);margin:22px auto 54px;padding:0 18px}.toolbar{display:grid;grid-template-columns:minmax(200px,1fr) minmax(180px,260px) minmax(180px,230px) auto;gap:10px;align-items:center;margin:0 0 12px}.control{width:100%;min-height:43px;padding:10px 12px;border:1px solid #d9e1eb;border-radius:10px;background:#fff;color:#172b49;font:500 12px 'Montserrat',Arial,sans-serif}.control:focus{outline:3px solid #e67e2230;border-color:#e67e22}.clear-btn{min-height:42px;padding:0 14px;border:1px solid #d9e1eb;border-radius:10px;background:#fff;color:#334155;font:700 11px 'Montserrat',Arial,sans-serif;cursor:pointer}.count{margin:0 0 16px;color:#68768b;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.path-card{--accent:#e67e22;min-width:0;overflow:hidden;display:flex;flex-direction:column;border:1px solid #e3e9f1;border-radius:15px;background:#fff;box-shadow:0 5px 18px #0a19310b;transition:transform .18s ease,box-shadow .18s ease}.path-card:hover{transform:translateY(-3px);box-shadow:0 11px 25px #0a193118}.path-cover{height:196px;position:relative;overflow:hidden;background:#e9eef5;border-bottom:4px solid var(--accent)}.path-cover img{width:100%;height:100%;display:block;object-fit:cover}.path-cover:after{content:'';position:absolute;inset:25% 0 0;background:linear-gradient(transparent,rgba(5,18,38,.76));pointer-events:none}.path-tag{position:absolute;top:13px;left:13px;z-index:2;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px;border:1px solid #ffffffb8;border-radius:20px;background:#ffffffeb;color:#17304f;font-size:10px;font-weight:800}.path-title{position:absolute;z-index:2;left:16px;right:14px;bottom:14px;margin:0;color:#fff;font-size:21px;line-height:1.25;font-weight:900;text-shadow:0 1px 4px #0008}.path-body{display:flex;flex:1;flex-direction:column;padding:15px}.path-body h2{margin:0 0 10px;color:#1c3659;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.steps{display:grid;gap:7px;margin:0 0 15px;padding:0;list-style:none}.steps li{position:relative;display:flex;align-items:flex-start;gap:9px;color:#43536b;font-size:11px;line-height:1.5}.step-number{width:21px;height:21px;flex:0 0 21px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,white);color:var(--accent);font-size:10px;font-weight:800}.path-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid #edf0f5}.stage-count{color:#6a7890;font-size:10px;font-weight:700}.details-btn{border:0;border-radius:20px;padding:9px 13px;background:var(--accent);color:#fff;font:800 10px 'Montserrat',Arial,sans-serif;cursor:pointer}.details-btn:hover{filter:brightness(.92)}
.empty{grid-column:1/-1;padding:34px 20px;border:1px dashed #cbd5e1;border-radius:14px;background:#fff;color:#68768b;text-align:center;font-size:13px;line-height:1.7}.empty strong{display:block;margin-bottom:5px;color:#203a5b;font-size:15px}
.modal{display:none;position:fixed;inset:0;z-index:40;padding:20px;align-items:center;justify-content:center;background:#071629a8}.modal.active{display:flex}.modal-box{width:min(540px,100%);max-height:86vh;overflow:auto;padding:22px;border-radius:16px;background:#fff;box-shadow:0 24px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.modal-head h2{margin:0;color:#0a1931;font-size:20px}.modal-tag{margin:5px 0 0;color:#68768b;font-size:11px}.close-btn{width:34px;height:34px;border:0;border-radius:50%;background:#eef2f7;color:#263b59;font-size:18px;cursor:pointer}.modal-photo{width:100%;max-height:220px;object-fit:cover;border-radius:10px;background:#edf1f5}.modal-section{margin:15px 0 8px;color:#1b3558;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.modal-steps{display:grid;gap:8px;counter-reset:journey;margin:0;padding:0;list-style:none}.modal-steps li{counter-increment:journey;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid #e5ebf2;border-radius:9px;background:#f8fafc;color:#3e5069;font-size:12px}.modal-steps li:before{content:counter(journey);width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#e8eef8;color:#294b77;font-size:10px;font-weight:800}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{gap:13px}}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.grid{grid-template-columns:1fr}.path-cover{height:185px}.hero{padding:28px 17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
<link rel="stylesheet" href="/assets/site-footer.css">
</head>
<body>
<nav class="top-nav" aria-label="Main navigation"><a class="brand" href="/">DIP<span>VTC</span></a><a class="home-link" href="/">Back to Home</a></nav>
<header class="hero"><h1 id="pageTitle">DIPVTC Study Pathways</h1><p id="pageSub">Explore routes, stages and qualifications across our school programs.</p></header>
<main class="content">
  <section class="toolbar" aria-label="Pathway filters"><input id="pathSearch" class="control" type="search" placeholder="Search pathways, tags or stages" aria-label="Search pathways, tags or stages"><select id="pathType" class="control" aria-label="Filter pathway type"><option value="">All pathway types</option></select><select id="pathSort" class="control" aria-label="Sort pathways"><option value="name">Pathway name A–Z</option><option value="short">Shortest journey</option><option value="long">Longest journey</option></select><button id="clearFilters" class="clear-btn" type="button">Clear filters</button></section>
  <p id="pathCount" class="count" aria-live="polite"></p><section id="pathGrid" class="grid" aria-label="Study pathways"></section>
</main>
<div class="modal" id="pathModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true"><div class="modal-box"><div class="modal-head"><div><h2 id="modalTitle"></h2><p id="modalTag" class="modal-tag"></p></div><button class="close-btn" type="button" aria-label="Close pathway details">×</button></div><img id="modalImage" class="modal-photo" alt=""><p class="modal-section">Pathway stages</p><ol id="modalSteps" class="modal-steps"></ol></div></div>
<script>
const defaultPathways=[
 {title:'Cambridge Pathway',tag:'ECD to A-Levels',image:'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=900',steps:['Cambridge Checkpoint','IGCSE / O-Level','AS Level','A-Level'],color:'#e67e22'},
 {title:'ZIMSEC Pathway',tag:'Local Excellence',image:'https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=900',steps:['ZIMSEC Checkpoint','Grade 7 Exams',"O'Level Exams",'A-Level Exams'],color:'#1e90ff'},
 {title:'Technical Pathway',tag:'HEXCO Certified',image:'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=900',steps:['HEXCO NC','HEXCO ND','Workshops','Industrial Attachment'],color:'#059669'},
 {title:'Vocational Pathway',tag:'Skills for Jobs',image:'https://images.unsplash.com/photo-1556761175-b413da4baf72?w=900',steps:['Hospitality','IT & Computers','Entrepreneurship','Short Courses'],color:'#7c3aed'}
];
function readServerPathways(){try{const value=JSON.parse(window.dipvtcStore.getItem('dipvtc_pathways_v2')||'null');return Array.isArray(value)?value:defaultPathways}catch{return defaultPathways}}
function normalizePathway(value,index){const pathway=value||{};const steps=Array.isArray(pathway.steps)?pathway.steps:pathway.steps?String(pathway.steps).split(','):[];return {title:String(pathway.title||'Study Pathway').trim(),tag:String(pathway.tag||'Pathway').trim(),image:String(pathway.image||'/assets/images/dipvtc.png').trim(),steps:steps.map(step=>String(step).trim()).filter(Boolean),color:/^#[0-9a-f]{3,8}$/i.test(String(pathway.color||''))?pathway.color:['#e67e22','#2586c7','#059669','#7c3aed'][index%4]}}
function pathwayImageUrl(value){const src=String(value||'').trim();if(/^https:\/\//i.test(src))return src;if(/^data:image\/(?:png|jpe?g|gif|webp|avif);/i.test(src))return src;if(src.startsWith('/assets/'))return src;if(src.startsWith('assets/'))return '/'+src;if(src.startsWith('images/'))return '/assets/'+src;return '/assets/images/dipvtc.png'}
function pathwayType(pathway){const text=(pathway.title+' '+pathway.tag).toLowerCase();if(text.includes('cambridge'))return 'Cambridge';if(text.includes('zimsec'))return 'ZIMSEC';if(text.includes('technical')||text.includes('hexco'))return 'Technical';if(text.includes('vocational')||text.includes('short course'))return 'Vocational';return 'Other'}
const pathways=readServerPathways().map(normalizePathway);const grid=document.getElementById('pathGrid');const search=document.getElementById('pathSearch');const typeFilter=document.getElementById('pathType');const sort=document.getElementById('pathSort');const modal=document.getElementById('pathModal');let displayed=[];
function fillTypes(){[...new Set(pathways.map(pathwayType))].sort().forEach(type=>{const option=document.createElement('option');option.value=type;option.textContent=type;typeFilter.appendChild(option)})}
function renderPathways(){const term=search.value.trim().toLowerCase();const type=typeFilter.value;displayed=pathways.filter(pathway=>{const matchesTerm=!term||[pathway.title,pathway.tag,...pathway.steps].join(' ').toLowerCase().includes(term);return matchesTerm&&(!type||pathwayType(pathway)===type)});displayed.sort((a,b)=>sort.value==='short'?a.steps.length-b.steps.length||a.title.localeCompare(b.title):sort.value==='long'?b.steps.length-a.steps.length||a.title.localeCompare(b.title):a.title.localeCompare(b.title));grid.replaceChildren();document.getElementById('pathCount').textContent='Showing '+displayed.length+' of '+pathways.length+' pathways';
 if(!pathways.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>Pathways are being updated.</strong>Please contact the college for current study route information.';grid.appendChild(empty);return}
 if(!displayed.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>No matching pathways found.</strong>Try another search or clear the filters.';grid.appendChild(empty);return}
 displayed.forEach((pathway,index)=>{const card=document.createElement('article');card.className='path-card';card.style.setProperty('--accent',pathway.color);const cover=document.createElement('div');cover.className='path-cover';const photo=document.createElement('img');photo.src=pathwayImageUrl(pathway.image);photo.alt='';photo.loading='lazy';photo.onerror=()=>{photo.onerror=null;photo.src='/assets/images/dipvtc.png'};cover.appendChild(photo);const tag=document.createElement('span');tag.className='path-tag';tag.textContent=pathway.tag;cover.appendChild(tag);const title=document.createElement('h2');title.className='path-title';title.textContent=pathway.title;cover.appendChild(title);const body=document.createElement('div');body.className='path-body';const heading=document.createElement('h2');heading.textContent='Your study journey';body.appendChild(heading);const steps=document.createElement('ol');steps.className='steps';pathway.steps.slice(0,4).forEach((label,stepIndex)=>{const item=document.createElement('li');const number=document.createElement('span');number.className='step-number';number.textContent=String(stepIndex+1);const text=document.createElement('span');text.textContent=label;item.append(number,text);steps.appendChild(item)});if(pathway.steps.length>4){const item=document.createElement('li');item.textContent='And '+(pathway.steps.length-4)+' more stages';steps.appendChild(item)}body.appendChild(steps);const foot=document.createElement('div');foot.className='path-foot';const count=document.createElement('span');count.className='stage-count';count.textContent=pathway.steps.length+' '+(pathway.steps.length===1?'stage':'stages');const button=document.createElement('button');button.type='button';button.className='details-btn';button.textContent='View full pathway';button.addEventListener('click',()=>openPathway(displayed[index]));foot.append(count,button);body.appendChild(foot);card.append(cover,body);grid.appendChild(card)})
}
function openPathway(pathway){document.getElementById('modalTitle').textContent=pathway.title;document.getElementById('modalTag').textContent=pathway.tag;const image=document.getElementById('modalImage');image.src=pathwayImageUrl(pathway.image);image.alt=pathway.title;image.onerror=()=>{image.onerror=null;image.src='/assets/images/dipvtc.png'};const steps=document.getElementById('modalSteps');steps.replaceChildren();pathway.steps.forEach(label=>{const item=document.createElement('li');item.textContent=label;steps.appendChild(item)});if(!pathway.steps.length){const item=document.createElement('li');item.textContent='Contact the college for pathway stages';steps.appendChild(item)}modal.classList.add('active');modal.setAttribute('aria-hidden','false');document.querySelector('.close-btn').focus()}
function closePathway(){modal.classList.remove('active');modal.setAttribute('aria-hidden','true')}
fillTypes();const requested=new URLSearchParams(location.search).get('pathway');if(requested)search.value=requested;search.addEventListener('input',renderPathways);typeFilter.addEventListener('change',renderPathways);sort.addEventListener('change',renderPathways);document.getElementById('clearFilters').addEventListener('click',()=>{search.value='';typeFilter.value='';sort.value='name';renderPathways();search.focus()});document.querySelector('.close-btn').addEventListener('click',closePathway);modal.addEventListener('click',event=>{if(event.target===modal)closePathway()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('active'))closePathway()});renderPathways();
</script>
<script src="/assets/site-footer.js" defer></script>
<script src="/assets/public-portal-banner.js" defer></script></body>
</html>

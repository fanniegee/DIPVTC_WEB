<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Help · DIPVTC</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f7;color:#172b49;font:14px Montserrat,Arial,sans-serif;padding:20px}.card{width:min(460px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 18px 60px #102b5918}h1{font-weight:900}.muted{color:#64748b;line-height:1.7}label{display:block;font-weight:800;font-size:11px;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cad5e2;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;color:white;background:#0a1931;font:800 13px Montserrat;cursor:pointer}#msg{min-height:32px;color:#1c6842;font-size:12px;line-height:1.6}</style></head><body><main class="card"><p style="color:#e67e22;font-weight:900">DIPVTC ACCOUNT SUPPORT</p><h1>Reset your password</h1><p class="muted">Submit the email on your school account. For your protection, this page will not confirm whether an account exists. Admissions or an administrator verifies your identity and emails a one-time reset message.</p><form id="form"><label for="email">ACCOUNT EMAIL</label><input id="email" type="email" autocomplete="email" required><button class="btn">Request password help</button></form><p id="msg"></p><a href="/login.html">Back to sign in</a></main><script>const formEl=document.getElementById('form'),emailEl=document.getElementById('email'),msgEl=document.getElementById('msg');formEl.addEventListener('submit',async e=>{e.preventDefault();msgEl.textContent='Submitting…';try{const r=await fetch('/api/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value})}),d=await r.json();msgEl.textContent=d.message||'Request received.'}catch{msgEl.textContent='Request received. Please contact Admissions if you need help.'}})</script></body></html>
